<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register | ResLink Mbombela</title>

<link
    rel="stylesheet"
    href="style.css"
>
```

</head>

<body>

```
<header class="navbar">

    <div class="logo">
        ResLink
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Register
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>
            Create Your Account
        </h1>

        <p>
            Register to find student accommodation
            in Mbombela.
        </p>


        <form
            id="register-form"
            enctype="multipart/form-data"
        >

            <!-- FULL NAME -->

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="full_name"
                placeholder="Enter your full name"
                required
            >


            <!-- EMAIL -->

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PHONE -->

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >


            <!-- DATE OF BIRTH -->

            <label>
                Date of Birth
            </label>

            <input
                type="date"
                id="date_of_birth"
                required
            >


            <!-- GENDER -->

            <label>
                Gender
            </label>

            <select
                id="gender"
                required
            >

                <option value="">
                    Select your gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

                <option value="Prefer not to say">
                    Prefer not to say
                </option>

            </select>


            <!-- INSTITUTION -->

            <label>
                Institution
            </label>

            <select
                id="institution_id"
                required
            >

                <option value="">
                    Select your institution
                </option>

                <option value="1">
                    University of Mpumalanga
                </option>

            </select>


            <!-- FUNDING TYPE -->

            <label>
                Funding Type
            </label>

            <select
                id="funding_type"
                required
            >

                <option value="">
                    Select your funding type
                </option>

                <option value="NSFAS">
                    NSFAS
                </option>

                <option value="Bursary">
                    Bursary
                </option>

                <option value="Self-funded">
                    Self-funded
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- FUNDING DOCUMENT -->

            <label>
                Funding Approval Document
            </label>

            <input
                type="file"
                id="funding_document"
                accept=".pdf,.jpg,.jpeg,.png"
            >

            <small>
                Upload your NSFAS or bursary approval
                document. PDF, JPG and PNG files are accepted.
            </small>


            <!-- PASSWORD -->

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <p
            id="register-message"
            class="form-message"
        ></p>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
