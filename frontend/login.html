<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | ResLink Mbombela</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">
            ResLink
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your ResLink account.
            </p>


            <form id="login-form">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <p
                id="login-message"
                class="form-message"
            ></p>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
